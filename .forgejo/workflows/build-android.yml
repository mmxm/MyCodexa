name: Build Android APK

# CI build only — verifies the app builds on every push/PR touching Android/** and keeps
# short-lived artifacts around for manual inspection. Does NOT publish anything to a Release;
# that only happens for official version tags, in release-android.yml.
#
# Mirrored from .github/workflows/build-android.yml — keep the two in sync.
# Action refs use fully-qualified https://github.com/... URLs because Codeberg's
# DEFAULT_ACTIONS_URL (data.forgejo.org) does not mirror every action used here.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Android/**'
      - '.forgejo/workflows/build-android.yml'
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Set up JDK 17
        uses: https://github.com/actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: https://github.com/gradle/actions/setup-gradle@v3

      # Self-hosted runner images (e.g. catthehacker/ubuntu) don't ship the Android SDK the
      # way GitHub's hosted ubuntu-latest does — bootstrap it explicitly so the build doesn't
      # depend on whatever happens to be baked into the runner's docker image.
      - name: Install Android SDK
        run: |
          set -x
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/licenses"
          curl -sSL --fail -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          # Pre-accept SDK licenses by writing the known hashes directly, instead of
          # `yes | sdkmanager --licenses`: once sdkmanager stops reading stdin, `yes` gets
          # SIGPIPE'd (exit 141), and pipefail turns that into a failed step even though the
          # licenses were accepted fine.
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: codexa-reader-debug
          path: Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── Release APK ─────────────────────────────────────────────────────────
      # Priority 1: KEYSTORE_FILE secret → Google Play / production key (base64)
      # Priority 2: DEV_KEYSTORE_* secrets → persistent dev key stored in secrets
      # Priority 3: No secrets → generate a fresh throwaway keystore on the fly
      - name: Prepare release keystore
        id: keystore
        working-directory: Android
        env:
          KEYSTORE_FILE_B64:      ${{ secrets.KEYSTORE_FILE }}
          DEV_KEYSTORE_FILE_B64:  ${{ secrets.DEV_KEYSTORE_FILE }}
          DEV_KEYSTORE_PASSWORD:  ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS:          ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD:       ${{ secrets.DEV_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE_B64" ]; then
            echo "Using production keystore from KEYSTORE_FILE secret"
            echo "$KEYSTORE_FILE_B64" | base64 -d > /tmp/release.jks
            echo "DEV_KEYSTORE_FILE=/tmp/release.jks"          >> $GITHUB_ENV
            echo "DEV_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "DEV_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"      >> $GITHUB_ENV
            echo "DEV_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -n "$DEV_KEYSTORE_FILE_B64" ]; then
            echo "Using dev keystore from DEV_KEYSTORE_FILE secret"
            echo "$DEV_KEYSTORE_FILE_B64" | grep -v '^-' | tr -d '\r\n ' | base64 -d > /tmp/release.jks
            echo "DEV_KEYSTORE_FILE=/tmp/release.jks"                  >> $GITHUB_ENV
            echo "DEV_KEYSTORE_PASSWORD=$DEV_KEYSTORE_PASSWORD"        >> $GITHUB_ENV
            echo "DEV_KEY_ALIAS=$DEV_KEY_ALIAS"                        >> $GITHUB_ENV
            echo "DEV_KEY_PASSWORD=$DEV_KEY_PASSWORD"                  >> $GITHUB_ENV
          else
            echo "No keystore secrets found — generating throwaway keystore"
            keytool -genkeypair \
              -keystore /tmp/release.jks \
              -alias codexa-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass codexa-ci-store \
              -keypass codexa-ci-key \
              -dname "CN=Codexa CI, OU=Codexa, O=Codexa, L=Unknown, ST=Unknown, C=SI"
            echo "DEV_KEYSTORE_FILE=/tmp/release.jks"  >> $GITHUB_ENV
            echo "DEV_KEYSTORE_PASSWORD=codexa-ci-store" >> $GITHUB_ENV
            echo "DEV_KEY_ALIAS=codexa-release"          >> $GITHUB_ENV
            echo "DEV_KEY_PASSWORD=codexa-ci-key"        >> $GITHUB_ENV
          fi

      - name: Build release APK
        working-directory: Android
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: codexa-reader-release
          path: Android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # Google Play requires an .aab (Android App Bundle), not the .apk above — Play itself
      # slices it into per-device APKs at install time. Uses the same release signingConfig,
      # so KEYSTORE_FILE (Play upload key, priority 1) / DEV_KEYSTORE_FILE (priority 2 fallback)
      # from the "Prepare release keystore" step above applies here too.
      - name: Build release bundle (AAB)
        working-directory: Android
        run: ./gradlew bundleRelease

      - name: Upload release bundle
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: codexa-reader-release-aab
          path: Android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
